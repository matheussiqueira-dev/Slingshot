name: CI

on:
  # Execução manual (Actions -> "CI" -> Run workflow). Política de automação mínima da conta
  # (auditoria FinOps de 06/11/2026): sem push, pull_request ou agendamento automáticos, para não
  # consumir a franquia de minutos. Rode antes de divulgar ou publicar uma mudança relevante.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and audit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit
